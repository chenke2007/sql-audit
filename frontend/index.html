<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL 智能审核系统</title>
    <script>
        // 抑制 Tailwind CDN 的生产环境警告（必须在 Tailwind 脚本之前执行）
        (function() {
            const origWarn = console.warn;
            console.warn = function(...args) {
                const msg = args.join(' ');
                if (msg.includes('cdn.tailwindcss.com should not be used in production')) return;
                origWarn.apply(console, args);
            };
        })();
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 (Global build) -->
    <script src="/static/js/vue.global.prod.js"></script>
    <!-- highlight.js for SQL syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <!-- Custom styles -->
    <style>
        [v-cloak] { display: none; }
        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        .sql-code { font-family: 'Consolas', 'Monaco', monospace; }
        /* SQL 语法高亮样式 */
        .sql-editor { background-color: #f6f8fa; }
        .sql-editor:focus { background-color: #fff; }
        /* 菜单切换动画优化 */
        .menu-transition { transition: all 0.15s ease; }
        /* highlight.js 自定义 */
        .hljs { background: #1e1e1e; border-radius: 0.5rem; padding: 1rem; }

        /* ===== 用户与权限管理 - Side Panel 侧边详情面板 ===== */
        .side-panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 60;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .side-panel-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .side-panel {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 420px;
            max-width: 90vw;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.08);
            z-index: 61;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }
        .side-panel.active {
            transform: translateX(0);
        }
        .role-tag-interactive {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .role-tag-interactive:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.25);
        }

        /* ===== 侧边栏子菜单 ===== */
        .sidebar-submenu {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
        }
        .sidebar-submenu.expanded {
            max-height: 120px;
        }
        .sidebar-subitem {
            padding-left: 2.75rem;
            font-size: 0.8125rem;
        }

        /* ===== 移动端响应式布局 ===== */
        /* 小屏幕下侧边栏样式 */
        @media (max-width: 767px) {
            #app > div > nav.sidebar-nav {
                position: fixed !important;
                top: 65px !important;
                left: 0 !important;
                bottom: 0 !important;
                z-index: 40 !important;
                transform: translateX(-100%) !important;
                transition: transform 0.3s ease !important;
                box-shadow: 2px 0 8px rgba(0,0,0,0.15) !important;
            }
            #app > div > nav.sidebar-nav.open {
                transform: translateX(0) !important;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.3);
                z-index: 35;
            }
            .sidebar-overlay.open {
                display: block;
            }
            .main-content {
                padding: 1rem !important;
            }
            .mobile-stack {
                flex-direction: column !important;
                align-items: stretch !important;
            }
            .mobile-stack > * {
                width: 100% !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
            .hamburger-btn {
                display: flex !important;
            }
        }
        @media (min-width: 768px) {
            .hamburger-btn {
                display: none !important;
            }
            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" v-cloak class="h-screen flex flex-col">
        <!-- Login Screen -->
        <div v-if="!isLoggedIn" class="fixed inset-0 bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center z-50">
            <div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-md mx-4">
                <div class="text-center mb-8">
                    <svg class="w-16 h-16 text-blue-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                    </svg>
                    <h1 class="text-2xl font-bold text-gray-800">SQL 智能审核系统</h1>
                    <p class="text-gray-500 mt-1">企业内网 SQL 审核工具</p>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                        <input v-model="loginForm.username" @keyup.enter="doLogin" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入用户名">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input v-model="loginForm.password" @keyup.enter="doLogin" type="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="请输入密码">
                    </div>
                    <div v-if="loginError" class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700">
                        {{ loginError }}
                    </div>
                    <button @click="doLogin" :disabled="loggingIn" class="w-full py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 font-medium flex items-center justify-center gap-2">
                        <svg v-if="loggingIn" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        {{ loggingIn ? '登录中...' : '登录' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Main App (after login) -->
        <template v-if="isLoggedIn">
            <!-- Header - Fixed -->
            <header class="bg-white shadow-sm border-b flex-shrink-0">
                <div class="max-w-full mx-auto px-4 py-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <!-- 移动端汉堡菜单按钮 -->
                        <button
                            @click="toggleSidebar"
                            class="hamburger-btn p-2 rounded-lg hover:bg-gray-100 text-gray-600"
                            title="菜单"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                        </svg>
                        <h1 class="text-xl font-bold text-gray-800">SQL 智能审核系统</h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-gray-500 text-sm">v1.3.0</span>
                        <!-- User Menu -->
                        <div ref="userMenuRef" class="relative">
                            <button @click="showUserMenu = !showUserMenu" class="flex items-center gap-2 text-sm text-gray-700 hover:text-gray-900 px-3 py-1.5 rounded-lg hover:bg-gray-100">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <span>{{ currentUser?.real_name || currentUser?.username }}</span>
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                </svg>
                            </button>
                            <div v-if="showUserMenu" class="absolute right-0 mt-1 w-48 bg-white rounded-lg shadow-lg border z-50">
                                <div class="px-4 py-2 border-b text-xs text-gray-500">
                                    角色: {{ currentUser?.roles?.join(', ') || '无' }}
                                </div>
                                <button @click="activeMenu = 'profile'; showUserMenu = false" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                    个人中心
                                </button>
                                <button @click="handleMenuClick('history'); showUserMenu = false" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    分析历史
                                </button>
                                <div v-if="hasPermission('user:manage')" class="border-t">
                                    <button @click="handleMenuClick('users'); showUserMenu = false" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                        用户管理
                                    </button>
                                    <button @click="handleMenuClick('roles'); showUserMenu = false" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                                        角色权限
                                    </button>
                                </div>
                                <div class="border-t">
                                    <button @click="doLogout" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                                        退出登录
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Layout -->
            <div class="flex flex-1 overflow-hidden">
                <!-- 移动端遮罩层 -->
                <div
                    class="sidebar-overlay"
                    :class="{ open: sidebarOpen }"
                    @click="sidebarOpen = false"
                ></div>

                <!-- Sidebar - Fixed -->
                <nav class="sidebar-nav w-52 flex-shrink-0 bg-white border-r overflow-y-auto" :class="{ open: sidebarOpen }">
                    <div class="p-2 space-y-1">
                        <!-- Regular menu items -->
                        <template v-for="item in visibleMenuItems" :key="item.key">
                            <!-- User & Permission expandable section -->
                            <template v-if="item.key === 'user_permissions'">
                                <div>
                                    <button
                                        @click="upExpanded = !upExpanded"
                                        :class="['w-full text-left px-4 py-3 flex items-center gap-3 menu-transition rounded-lg', activeMenu === 'user_permissions' ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50']"
                                    >
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="item.icon"></path>
                                        </svg>
                                        <span class="flex-1">{{ item.label }}</span>
                                        <svg
                                            class="w-4 h-4 transition-transform duration-200"
                                            :class="{ 'rotate-180': upExpanded }"
                                            fill="none"
                                            stroke="currentColor"
                                            viewBox="0 0 24 24"
                                        >
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                        </svg>
                                    </button>
                                    <div class="sidebar-submenu" :class="{ expanded: upExpanded }">
                                        <button
                                            @click="handleMenuClick('up_users')"
                                            :class="['w-full text-left sidebar-subitem py-2.5 flex items-center gap-2 menu-transition rounded-lg', upTab === 'users' && activeMenu === 'user_permissions' ? 'text-blue-600 bg-blue-50/60' : 'text-gray-500 hover:bg-gray-50']"
                                        >
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                            </svg>
                                            用户列表
                                        </button>
                                        <button
                                            @click="handleMenuClick('up_roles')"
                                            :class="['w-full text-left sidebar-subitem py-2.5 flex items-center gap-2 menu-transition rounded-lg', upTab === 'roles' && activeMenu === 'user_permissions' ? 'text-blue-600 bg-blue-50/60' : 'text-gray-500 hover:bg-gray-50']"
                                        >
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                                            </svg>
                                            角色配置
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <button
                                v-else
                                @click="handleMenuClick(item.key)"
                                :class="['w-full text-left px-4 py-3 flex items-center gap-3 menu-transition rounded-lg', activeMenu === item.key ? 'bg-blue-50 text-blue-600' : 'text-gray-600 hover:bg-gray-50']"
                            >
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" :d="item.icon"></path>
                                </svg>
                                {{ item.label }}
                            </button>
                        </template>
                    </div>
                </nav>

                <!-- Main Content - Scrollable -->
                <main class="main-content flex-1 overflow-y-auto p-6">
                    <div class="max-w-5xl mx-auto">
                    <!-- SQL Analysis -->
                    <div v-if="activeMenu === 'analyze'" class="space-y-6">
                        <!-- Data Source & Schema Selector -->
                        <div class="bg-white rounded-lg shadow-sm p-4">
                            <div class="flex items-center gap-6 flex-wrap">
                                <!-- Data Source -->
                                <div class="flex items-center gap-2">
                                    <label class="text-sm font-medium text-gray-700">选择数据源:</label>
                                    <select v-model="selectedAnalyzeSource" @change="onAnalyzeSourceChange" class="px-3 py-2 border rounded-lg min-w-[200px]">
                                        <option v-for="source in dbSources" :key="source.id" :value="source.id">
                                            {{ source.name }} ({{ source.db_type?.toUpperCase() }})
                                        </option>
                                    </select>
                                    <span v-if="selectedAnalyzeSource" class="text-sm text-gray-500">
                                        {{ dbSources.find(s => s.id === selectedAnalyzeSource)?.host }}:{{ dbSources.find(s => s.id === selectedAnalyzeSource)?.port }}
                                    </span>
                                </div>
                                <!-- Schema -->
                                <div v-if="selectedAnalyzeSource" class="flex items-center gap-2">
                                    <label class="text-sm font-medium text-gray-700">选择 Schema:</label>
                                    <select v-model="selectedSchema" class="px-3 py-2 border rounded-lg min-w-[160px]">
                                        <option value="">请选择 Schema</option>
                                        <option v-for="schema in schemaList" :key="schema" :value="schema">
                                            {{ schema }}
                                        </option>
                                    </select>
                                    <span v-if="loadingSchemas" class="text-sm text-gray-400">加载中...</span>
                                    <span v-else-if="schemaList.length === 0" class="text-sm text-orange-500">未获取到 Schema 列表</span>
                                </div>
                                <button @click="loadDBSources" class="text-sm text-blue-600 hover:text-blue-800 ml-auto">刷新列表</button>
                            </div>
                        </div>

                        <!-- Input Card -->
                        <div class="bg-white rounded-lg shadow-sm p-6">
                            <div class="flex gap-2 mb-4">
                                <button
                                    v-for="mode in inputModes"
                                    :key="mode.key"
                                    @click="analyzeMode = mode.key"
                                    :class="['px-4 py-2 rounded-lg text-sm font-medium transition-colors', analyzeMode === mode.key ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200']"
                                >
                                    {{ mode.label }}
                                </button>
                            </div>

                            <!-- Text Input -->
                            <div v-if="analyzeMode === 'text'">
                                <textarea
                                    v-model="sqlText"
                                    rows="8"
                                    placeholder="请输入需要分析的 SQL 语句...&#10;示例: SELECT id, name FROM users WHERE status = 'active'"
                                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sql-code text-sm"
                                    spellcheck="false"
                                ></textarea>
                                <!-- 输入提示 -->
                                <div class="mt-2 text-xs text-gray-500 flex items-center gap-4">
                                    <span v-if="!sqlText.trim()" class="text-orange-500">请先输入 SQL 语句</span>
                                    <span v-else-if="!selectedAnalyzeSource" class="text-orange-500">请先选择数据源</span>
                                    <span v-else-if="!selectedSchema" class="text-orange-500">请先选择 Schema</span>
                                    <span v-else class="text-green-600">准备就绪，点击"开始分析"</span>
                                </div>
                                <div class="flex items-center justify-between mt-4">
                                    <div class="flex gap-4">
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" v-model="useLLM" class="w-4 h-4 text-blue-600 rounded">
                                            <span class="text-sm text-gray-600">启用 AI 分析</span>
                                        </label>
                                        <label class="flex items-center gap-2 cursor-pointer">
                                            <input type="checkbox" v-model="useRules" class="w-4 h-4 text-blue-600 rounded">
                                            <span class="text-sm text-gray-600">启用规则检查</span>
                                        </label>
                                    </div>
                                    <button
                                        @click="analyzeSQL"
                                        :disabled="analyzing || !sqlText.trim() || !selectedAnalyzeSource || !selectedSchema"
                                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-2"
                                    >
                                        <svg v-if="analyzing" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        {{ analyzing ? '分析中...' : '开始分析' }}
                                    </button>
                                </div>
                            </div>

                            <!-- SQL_ID Input -->
                            <div v-if="analyzeMode === 'sql_id'">
                                <input
                                    v-model="sqlId"
                                    placeholder="请输入 SQL_ID (如: 1a2b3c4d...)"
                                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 mb-4"
                                >
                                <div class="flex items-center justify-between">
                                    <label class="flex items-center gap-2 cursor-pointer">
                                        <input type="checkbox" v-model="useLLM" class="w-4 h-4 text-blue-600 rounded">
                                        <span class="text-sm text-gray-600">启用 AI 分析</span>
                                    </label>
                                    <button
                                        @click="analyzeBySqlId"
                                        :disabled="analyzing || !sqlId.trim() || !selectedAnalyzeSource"
                                        class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300"
                                    >
                                        {{ analyzing ? '分析中...' : '从数据库查询并分析' }}
                                    </button>
                                </div>

                            </div>

                            <!-- Rule Violations -->
                            <div v-if="analysisResult.rule_violations?.length" class="mb-6">

                                        </div>
                                        <p class="text-gray-600 text-sm mb-1 break-words">{{ v.message }}</p>
                                        <p class="text-blue-600 text-sm break-words">{{ v.suggestion }}</p>
                                    </div>
                                </div>
                            </div>

                                        <div v-for="(idx, i) in analysisResult.llm_analysis.index_suggestions" :key="i"

                                            <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                                                <span class="font-medium" :class="idx.note ? 'text-yellow-900' : 'text-green-900'">{{ idx.table }} 表</span>
                                                <span v-if="idx.estimate_benefit" class="text-xs px-2 py-1 rounded"

                                            </div>
                                            <p class="text-sm mb-2 break-words" :class="idx.note ? 'text-yellow-700' : 'text-green-700'"

                                            <div v-if="idx.note" class="bg-yellow-100 border border-yellow-300 text-yellow-800 p-2 rounded text-sm mb-2">
                                                {{ idx.note }}
                                            </div>

                                            <div v-if="idx.sql && idx.sql.trim()" class="relative group">
                                                <pre class="bg-gray-900 text-gray-100 p-3 rounded-lg sql-code text-sm mb-2 whitespace-pre-wrap break-all overflow-x-auto">{{ idx.sql }}</pre>

                                    </ol>
                                </div>
                            </div>
                        </div>

                                </button>
                            </div>

                                        <th class="px-3 py-2 text-right font-medium text-gray-600">Physical Reads</th>

                                    </tr>
                                </thead>
                                <tbody>

                                                <span class="text-gray-700">{{ sql.elapsed_pct != null ? sql.elapsed_pct.toFixed(1) : '0.0' }}%</span>
                                            </div>

                                        <td class="px-3 py-2 text-right font-mono">{{ sql.elapsed_sec != null ? sql.elapsed_sec.toFixed(2) : '0.00' }}</td>

                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                        <p v-else-if="!collecting" class="text-gray-500 text-center py-8">暂无数据，点击上方按钮采集</p>

                                            </label>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                        signal: controller.signal,
                        headers: {
                            ...(options.headers || {}),

                        opts.headers['Content-Type'] = 'application/json';

                const getRoleTag = (name) => {
                    const map = {
                        'admin': '超级管理员',
                        'dba': 'DBA',
                        'developer': '开发者'
                    };
                    return map[name?.toLowerCase()] || '自定义';
                };

                const selectRole = (role) => {
                    selectedRole.value = role;
                    roleDsPage.value = 1;
                    showDsAssignForm.value = false;
                    dsAssignSourceId.value = '';
                    loadRoleDsPermissions(role.id);
                };

                const loadRoleDsPermissions = async (roleId) => {
                    loadingRoleDsPermissions.value = true;
                    try {
                        let all = datasourcePermissions.value;
                        // Fetch fresh data if local cache is empty
                        if (all.length === 0) {
                            const res = await apiFetch('/api/datasource-permissions');
                            if (res.ok) {
                                all = await res.json();
                                datasourcePermissions.value = all;
                            }
                        }
                        // Filter for selected role and enrich with source description
                        const filtered = all.filter(dp => dp.role_id === roleId).map(dp => {
                            const source = dbSources.value.find(s => s.id === dp.db_source_id);
                            return {
                                ...dp,
                                description: source?.description || '',
                                db_source_name: source?.name || dp.db_source_name || dp.db_source_id
                            };
                        });
                        roleDsPermissions.value = filtered;
                    } catch (e) {
                        roleDsPermissions.value = [];
                    } finally {
                        loadingRoleDsPermissions.value = false;
                    }
                };

                const assignDsToSelectedRole = async () => {
                    if (!selectedRole.value || !dsAssignSourceId.value) return;
                    try {
                        const res = await apiFetch('/api/datasource-permissions', {
                            method: 'POST',
                            body: JSON.stringify({
                                role_id: selectedRole.value.id,
                                db_source_id: dsAssignSourceId.value
                            })
                        });
                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            throw new Error(extractErrorMessage(err, '分配失败'));
                        }
                        showToast('数据源权限分配成功', 'success');
                        dsAssignSourceId.value = '';
                        showDsAssignForm.value = false;
                        // 先刷新全局列表，再刷新角色列表，确保 loadRoleDsPermissions 使用的是最新缓存
                        const dsRes = await apiFetch('/api/datasource-permissions');
                        if (dsRes.ok) datasourcePermissions.value = await dsRes.json();
                        loadRoleDsPermissions(selectedRole.value.id);
                    } catch (e) {
                        showToast(e.message, 'error');
                    }
                };

                const loadRolesList = async () => {
                    loadingRoles.value = true;
                    try {
                        const [rolesRes, dsRes] = await Promise.allSettled([
                            apiFetch('/api/roles'),
                            apiFetch('/api/datasource-permissions')
                        ]);
                        if (rolesRes.status === 'fulfilled' && rolesRes.value.ok) {
                            rolesList.value = await rolesRes.value.json();
                            // Auto-select first role if none selected
                            if (!selectedRole.value && rolesList.value.length > 0) {
                                selectRole(rolesList.value[0]);
                            } else if (selectedRole.value) {
                                // Refresh selected role data
                                const updated = rolesList.value.find(r => r.id === selectedRole.value.id);
                                if (updated) {
                                    selectedRole.value = updated;
                                } else if (rolesList.value.length > 0) {
                                    // Previously selected role was deleted, select first available
                                    selectRole(rolesList.value[0]);
                                } else {
                                    selectedRole.value = null;
                                }
                            }
                        } else if (rolesRes.status === 'fulfilled' && !rolesRes.value.ok) {
                            const err = await rolesRes.value.json().catch(() => ({}));
                            showToast(extractErrorMessage(err, '加载角色列表失败'), 'error');
                            rolesList.value = [];
                        }
                        if (dsRes.status === 'fulfilled' && dsRes.value.ok) {
                            datasourcePermissions.value = await dsRes.value.json();
                            // Update selected role's datasource permissions using fetched data
                            if (selectedRole.value) {
                                roleDsPermissions.value = datasourcePermissions.value
                                    .filter(dp => dp.role_id === selectedRole.value.id)
                                    .map(dp => {
                                        const source = dbSources.value.find(s => s.id === dp.db_source_id);
                                        return {
                                            ...dp,
                                            description: source?.description || '',
                                            db_source_name: source?.name || dp.db_source_name || dp.db_source_id
                                        };
                                    });
                            }
                        }
                    } catch (e) {
                        showToast('加载失败', 'error');
                    } finally {
                        loadingRoles.value = false;
                    }
                };

                const openRolePermissionModal = async (role) => {
                    editingRole.value = role;
                    showRolePermissionModal.value = true;
                    loadingRolePermissions.value = true;
                    try {
                        const res = await apiFetch(`/api/roles/${role.id}/permissions`);
                        if (res.ok) {
                            const data = await res.json();
                            allPermissions.value = data.permissions || [];
                        }
                    } catch (e) {
                        showToast('加载失败', 'error');
                    } finally {
                        loadingRolePermissions.value = false;
                    }
                };

                const togglePermission = (perm) => {
                    perm.granted = !perm.granted;
                };

                const saveRolePermissions = async () => {
                    const grantedIds = allPermissions.value.filter(p => p.granted).map(p => p.id);
                    savingRolePermissions.value = true;
                    try {
                        const res = await apiFetch(`/api/roles/${editingRole.value.id}/permissions`, {
                            method: 'PUT',
                            body: JSON.stringify({ permission_ids: grantedIds })
                        });
                        if (!res.ok) throw new Error('保存失败');
                        showToast('权限已更新', 'success');
                        showRolePermissionModal.value = false;
                        loadRolesList();
                    } catch (e) {
                        showToast(e.message, 'error');
                    } finally {
                        savingRolePermissions.value = false;
                    }
                };

                const assignDatasourcePermission = async () => {
                    if (!dsPermRoleId.value || !dsPermSourceId.value) return;
                    try {
                        const res = await apiFetch('/api/datasource-permissions', {
                            method: 'POST',
                            body: JSON.stringify({
                                role_id: parseInt(dsPermRoleId.value),
                                db_source_id: dsPermSourceId.value
                            })
                        });
                        if (!res.ok) {
                            const err = await res.json().catch(() => ({}));
                            throw new Error(extractErrorMessage(err, '分配失败'));
                        }
                        showToast('数据源权限分配成功', 'success');
                        dsPermRoleId.value = '';
                        dsPermSourceId.value = '';
                        // 刷新全局权限列表，使弹窗和角色详情页同步更新
                        const dsRes = await apiFetch('/api/datasource-permissions');
                        if (dsRes.ok) datasourcePermissions.value = await dsRes.json();
                        loadRolesList();
                    } catch (e) {
                        showToast(e.message, 'error');
                    }
                };

                const revokeDatasourcePermission = async (roleId, dbSourceId) => {
                    if (!confirm('确定撤销此数据源权限吗？')) return;
                    try {
                        const res = await apiFetch(`/api/datasource-permissions/${roleId}/${dbSourceId}`, { method: 'DELETE' });
                        if (!res.ok) throw new Error('撤销失败');
                        showToast('已撤销', 'success');
                        // 先刷新全局列表，再刷新角色列表
                        const dsRes = await apiFetch('/api/datasource-permissions');
                        if (dsRes.ok) datasourcePermissions.value = await dsRes.json();
                        loadRoleDsPermissions(roleId);
                        loadRolesList();
                    } catch (e) {
                        showToast(e.message, 'error');
                    }
                };

                return {
                    // Auth
                    isLoggedIn, currentUser, showUserMenu, loginForm, loginError, loggingIn,
                    doLogin, doLogout, hasPermission,
                    // App
                    sidebarOpen, toggleSidebar,
                    activeMenu, analyzeMode, sqlText, sqlId,
                    useLLM, useRules, analyzing, exporting, collecting, collectionTopN, collectionError, excludeSystemSQL, loadingRules,
                    analysisResult, exportFormat, exportFormats, collectedSQLs, rules, toasts, fileInput,
                    // DB Sources
                    dbSources, loadingDBSources, dbSourceFilter, showDBSourceModal, editingDBSource, dbSourceForm, testingSource, testingModal, savingDBSource, testResult,
                    selectedCollectionSource, selectedAnalyzeSource, selectedSchema, schemaList, loadingSchemas,
                    // Menu
                    visibleMenuItems, inputModes,
                    analyzeSQL, analyzeBySqlId, collectSlowSQLs, analyzeCollectedSQL, onCollectionSourceChange, onAnalyzeSourceChange, loadSchemas,
                    loadRules, toggleRule, triggerFileUpload, handleFileUpload,
                    getRiskClass, getSeverityClass, handleMenuClick, copyToClipboard, exportReport,
                    // DB Source Methods
                    loadDBSources, openDBSourceModal, saveDBSource, deleteDBSource, testDBSourceConnection, testDBSourceConnectionFromForm,
                    // History
                    historyItems, historyTotal, historyPage, historyPageSize, loadingHistory, historyFilter,
                    showHistoryDetailModal, historyDetail,
                    loadHistory, viewHistoryDetail, deleteHistory, formatDate, formatJson,
                    // Profile
                    passwordForm, changingPassword, changePassword,
                    // Users
                    users, loadingUsers, showUserModal, editingUser, userForm, savingUser, allRoles,
                    loadUsers, openUserModal, saveUser, disableUser, resetUserPassword,
                    // Roles
                    rolesList, loadingRoles, showRolePermissionModal, editingRole, allPermissions,
                    savingRolePermissions, loadingRolePermissions, showRoleModal, roleForm, savingRole,
                    loadRolesList, openRolePermissionModal, togglePermission, saveRolePermissions,
                    openRoleModal, saveRole, deleteRole,
                    // Role Page
                    selectedRole, roleSearchQuery, roleDsPermissions, loadingRoleDsPermissions,
                    roleDsPage, roleDsPageSize, showDsAssignForm, dsAssignSourceId, showAllDsPermModal,
                    filteredRoles, groupedPermissions, paginatedRoleDsPermissions, roleDsTotalPages,
                    availableDbSourcesForRole,
                    getRoleAvatarClass, getRoleTagClass, getRoleTag, selectRole,
                    loadRoleDsPermissions, assignDsToSelectedRole,
                    // Datasource Permissions
                    datasourcePermissions, dsPermRoleId, dsPermSourceId,
                    assignDatasourcePermission, revokeDatasourcePermission,
                    // Unified User & Permission Panel
                    upTab, upExpanded,
                    showRoleSidePanel, sidePanelRole, sidePanelLoading,
                    usersBySelectedRole, sidePanelGroupedPermissions,
                    openRoleSidePanel, closeRoleSidePanel
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
